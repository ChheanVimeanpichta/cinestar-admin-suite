apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinestar-admin-ingress
spec:
  rules:
    - host: admin.cinestar.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-frontend
                port:
                  number: 80
