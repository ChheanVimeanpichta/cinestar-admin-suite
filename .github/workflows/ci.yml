name: Admin Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'admin-backend/**'
      - '.github/workflows/ci.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build test
        working-directory: admin-backend
        run: |
          npm install
          npm run build

      - name: Copy Files to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: 3.213.27.244
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "admin-backend/."
          target: "~/deploy-admin-api"

      - name: Build and Run with Docker on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 3.213.27.244
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Install Docker if not installed
            if ! command -v docker &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl
              sudo install -m 0755 -d /etc/apt/keyrings
              sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
              sudo chmod a+r /etc/apt/keyrings/docker.asc
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo systemctl start docker
            fi
            cd ~/deploy-admin-api
            sudo tee .env > /dev/null <<EOF
            DATABASE_URL=${{ secrets.ADMIN_DATABASE_URL }}
            JWT_SECRET=${{ secrets.ADMIN_JWT_SECRET }}
            ADMIN_JWT_SECRET=${{ secrets.ADMIN_JWT_SECRET }}
            PORT=5000
            EOF
            sudo docker rm -f admin-api || true
            sudo docker build -t admin-api .
            sudo docker run -d --name admin-api -p 5000:5000 --env-file .env admin-api
            sudo docker image prune -f

      - name: Send Telegram Notification (Success)
        uses: appleboy/telegram-action@master
        if: success()
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ✅ Admin Backend Deployment Successful!
            Application: admin-api (CineStar Admin Suite)
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.event.head_commit.message }}
            Actor: ${{ github.actor }}

      - name: Send Telegram Sticker
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendSticker" \
            -d chat_id="${{ secrets.TELEGRAM_TO }}" \
            -d sticker="CAACAgIAAxkBAAERnjRqaKaLMjN7XRTnrWtHGxsFXZ4SKQACNDoAArR2CUgmpTx1tcQieD0E"

      - name: Send Telegram Notification (Failure)
        uses: appleboy/telegram-action@master
        if: failure()
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ Admin Backend Deployment FAILED!
            Application: admin-api (CineStar Admin Suite)
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.event.head_commit.message }}
            Actor: ${{ github.actor }}
            Please check the GitHub Actions logs immediately!

      - name: Send Telegram Sticker
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendSticker" \
            -d chat_id="${{ secrets.TELEGRAM_TO }}" \
            -d sticker="CAACAgUAAxkBAAERnjhqaKaq1MAUePutHWKxn2tJqkJcwwACnR0AAmJaIFfm9Eeebau1Vj0E"
